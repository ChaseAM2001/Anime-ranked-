<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0d12"><link rel="manifest" href="manifest.webmanifest"><title>Anime Archive</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0d12;color:#f5f4f7;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:28px 18px 12px;position:sticky;top:0;background:#0c0d12ed;backdrop-filter:blur(12px);z-index:2}h1{font-size:25px;letter-spacing:2px;margin:0}small,.muted{color:#9697a5}header p{margin:6px 0 15px}.tools{display:flex;gap:8px}input,select,button,textarea{background:#20212a;color:#fff;border:1px solid #393a45;border-radius:10px;padding:10px;font:inherit}input{width:100%;min-width:0}select{max-width:145px}main{padding:12px 14px 70px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.item{min-width:0;cursor:pointer}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#262936,#14151d);border:1px solid #343743;border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.poster.has-image{color:transparent}.poster .rank{color:#fff;z-index:1}.poster .fallback{font-size:13px;color:#ddd}.poster.has-image .fallback{display:none}.rank{position:absolute;top:7px;left:7px;background:#0c0d12d9;border:1px solid #6e7180;border-radius:7px;padding:3px 6px;font-size:12px;font-weight:700}.name{font-weight:650;font-size:13px;margin:6px 1px 2px;line-height:1.3}.score{font-size:12px;color:#f4c56d}.status{font-size:11px;color:#aaaab4}.subhead{font-size:17px;margin:15px 0}.note{font-size:12px;color:#a5a6b3;margin-top:16px}dialog{background:#191a23;color:#fff;border:1px solid #464754;border-radius:17px;width:min(94vw,480px);max-height:85vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 7px}dialog p{line-height:1.55;color:#d1d0d8}.close{float:right}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}textarea{width:100%;min-height:95px}label{display:block;margin-top:12px;margin-bottom:5px;color:#b7b7c2;font-size:13px}@media(min-width:650px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}</style></head><body><header><h1>ANIME ARCHIVE</h1><p class="muted">Personal rankings · Action / Drama / Other</p><div class="tools"><input id="search" placeholder="Search your archive…"><select id="filter"><option value="ranked">Ranked</option><option value="all">All entries</option><option value="unfinished">Unfinished</option><option value="dropped">Dropped</option></select></div></header><main><h2 class="subhead" id="heading">Your rankings</h2><div class="grid" id="grid"></div><p class="note">Cover artwork loads online from MyAnimeList via Jikan when available; first load may take a minute. Covers are cached on this device. Ratings and reviews are stored on this device. Romance titles are intentionally excluded.</p><div class="actions"><button id="import">Import updates</button><button id="export">Export archive</button></div><input id="file" type="file" accept="application/json" hidden></main><dialog id="detail"><button class="close" id="close">✕</button><h2 id="title"></h2><div id="subtitle" class="muted"></div><label>Your notes / why it stands out</label><textarea id="notes"></textarea><label>Rating (leave blank for unrated)</label><input id="rating" type="number" min="0" max="10" step="0.5"><div class="actions"><button id="save">Save changes</button></div></dialog><script>
const seed=[
['Solo Leveling',10,'Completed','Earned power progression, confidence, strong fights and protecting others.'],['Cyberpunk: Edgerunners',10,'Completed','Emotional stakes, striking aesthetic and relationships.'],['Berserk (1997)',10,'Completed','Dark storytelling, characters and emotional consequences.'],['Darling in the Franxx',10,'Completed','Character bonds, devotion and emotional stakes.'],['Initial D',10,'Completed','Personal nostalgic classic; cars, mountain roads, music and Takumi’s growth. Not a recommendation signal.'],['Attack on Titan',10,'Unfinished','Highly rated so far; not yet completed.'],['Vinland Saga — Season 1',9,'Completed','Thorfinn’s dual-dagger combat, progression, Askeladd and loss of purpose. Season 2 unfinished.'],['86 Eighty-Six',9,'Completed','Strong emotional story and character relationships.'],['Chainsaw Man — Reze Arc',9,'Completed','Provisional rating: earlier conversations also mention 10/10.'],['Cowboy Bebop',9,'Completed','Distinctive atmosphere and style.'],['Soul Eater',9,'Completed','Distinctive aesthetic and characters.'],['Chainsaw Man — Season 1',8,'Completed',''],["Hell’s Paradise — Season 1",8,'Completed',''],['Black Butler',8,'Completed',''],['Blue Eye Samurai',8,'Completed',''],['Dandadan — Seasons 1–2',8,'Completed',''],['Baki the Grappler',8,'Completed',''],['The Rising of the Shield Hero — Season 1',7.5,'Completed','Previously rated 7–8/10.'],['BAKI — Season 1 Part 2',7.5,'Completed',''],['BAKI — Season 1 Part 1',7,'Completed',''],['Goblin Slayer — Season 1',5.5,'Completed',''],['Vivy: Fluorite Eye’s Song',3.5,'Dropped','Stopped after about three episodes. Prior rating 3–4/10.'],['Naruto',null,'Unfinished','Enjoyed but too long to complete; deliberately unrated.'],['Hajime no Ippo',null,'Unfinished','Enjoyed but too long to complete; deliberately unrated.'],['Baki Hanma',null,'Dropped','Stopped around the Pickle arc.'],["JoJo’s Bizarre Adventure",null,'Dropped','Repeatedly stopped in Phantom Blood when Zeppeli appeared; not interested in continuing.']];
// Public anime artwork lookup; ratings and reviews remain entirely local.
const coverQueries={
'Solo Leveling':'Solo Leveling','Cyberpunk: Edgerunners':'Cyberpunk Edgerunners','Berserk (1997)':'Kenpuu Denki Berserk','Darling in the Franxx':'Darling in the FranXX','Initial D':'Initial D First Stage','Attack on Titan':'Shingeki no Kyojin','Vinland Saga — Season 1':'Vinland Saga','86 Eighty-Six':'86','Chainsaw Man — Reze Arc':'Chainsaw Man Movie Reze-hen','Cowboy Bebop':'Cowboy Bebop','Soul Eater':'Soul Eater','Chainsaw Man — Season 1':'Chainsaw Man',"Hell’s Paradise — Season 1":'Jigokuraku','Black Butler':'Kuroshitsuji','Blue Eye Samurai':'Blue Eye Samurai','Dandadan — Seasons 1–2':'Dandadan','Baki the Grappler':'Grappler Baki','The Rising of the Shield Hero — Season 1':'Tate no Yuusha no Nariagari','BAKI — Season 1 Part 2':'Baki 2018','BAKI — Season 1 Part 1':'Baki 2018','Goblin Slayer — Season 1':'Goblin Slayer',"Vivy: Fluorite Eye’s Song":'Vivy Fluorite Eyes Song','Naruto':'Naruto','Hajime no Ippo':'Hajime no Ippo','Baki Hanma':'Hanma Baki',"JoJo’s Bizarre Adventure":'JoJo no Kimyou na Bouken 2012'};
const coverKey='anime-archive-covers-v2';let coverCache={};try{coverCache=JSON.parse(localStorage.getItem(coverKey))||{}}catch{};
const coverTargets=new Map(),coverQueue=[],queued=new Set();let coverRunning=false;
function attachCover(p,url){if(!url||p.querySelector('img'))return;let img=document.createElement('img');img.alt='Anime cover artwork';img.loading='lazy';img.referrerPolicy='no-referrer';img.onload=()=>p.classList.add('has-image');img.onerror=()=>img.remove();img.src=url;p.prepend(img)}
function queueCover(name){if(coverCache[name]||queued.has(name))return;queued.add(name);coverQueue.push(name);if(!coverRunning)processCovers()}
async function processCovers(){coverRunning=true;while(coverQueue.length){let name=coverQueue.shift();try{let query=coverQueries[name]||name;let response=await fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(query)+'&limit=5');if(response.ok){let json=await response.json();let matches=json.data||[];let first=matches[0];if(first){let url=first.images?.jpg?.large_image_url||first.images?.jpg?.image_url;if(url){coverCache[name]=url;try{localStorage.setItem(coverKey,JSON.stringify(coverCache))}catch{};let target=coverTargets.get(name);if(target&&target.isConnected)attachCover(target,url)}}}else if(response.status===429){await new Promise(r=>setTimeout(r,3000))}}catch(e){console.warn('Artwork unavailable for',name,e)}await new Promise(r=>setTimeout(r,1100))}coverRunning=false}
const KEY='anime-archive-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed.map((x,i)=>({id:i,name:x[0],rating:x[1],status:x[2],notes:x[3]}))}catch{data=seed.map((x,i)=>({id:i,name:x[0],rating:x[1],status:x[2],notes:x[3]}))}let selected=null;const $=x=>document.getElementById(x);function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let rows=data.filter(x=>x.name.toLowerCase().includes(q)&&(f==='all'||f==='ranked'&&x.rating!==null&&x.status!=='Dropped'||f==='unfinished'&&x.status==='Unfinished'||f==='dropped'&&x.status==='Dropped'));rows.sort((a,b)=>(b.rating??-1)-(a.rating??-1)||a.id-b.id);$('heading').textContent=f==='ranked'?'Your rankings':f==='all'?'All anime':f==='dropped'?'Dropped':'Unfinished';$('grid').replaceChildren();rows.forEach((x,i)=>{let card=document.createElement('div');card.className='item';let p=document.createElement('div');p.className='poster';let fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=x.name;p.append(fallback);let cached=coverCache[x.name];if(cached){attachCover(p,cached)}else{coverTargets.set(x.name,p);queueCover(x.name)}let badge=document.createElement('span');badge.className='rank';badge.textContent=f==='ranked'?'#'+(i+1):x.status;p.append(badge);let name=document.createElement('div');name.className='name';name.textContent=x.name;let score=document.createElement('div');score.className='score';score.textContent=x.rating===null?'Unrated':'★ '+x.rating+'/10';card.append(p,name,score);card.onclick=()=>openDetail(x);$('grid').append(card)})}function openDetail(x){selected=x;$('title').textContent=x.name;$('subtitle').textContent=x.status;$('notes').value=x.notes||'';$('rating').value=x.rating??'';$('detail').showModal()}$('close').onclick=()=>$('detail').close();$('save').onclick=()=>{selected.notes=$('notes').value;selected.rating=$('rating').value===''?null:Math.min(10,Math.max(0,Number($('rating').value)));persist();$('detail').close();render()};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='anime-archive.json';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v)||!v.every(x=>typeof x.name==='string'&&typeof x.status==='string'))throw Error('Invalid format');data=v.filter(x=>!/(horimiya|dress.up darling|fragrant flower|sign of affection|alya|happy marriage|blue box|more than a married|angel next door|honey lemon soda)/i.test(x.name));persist();render();alert('Archive updated')}catch(err){alert('Could not import: '+err.message)}};render();
</script></body></html>
